<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehículos CC Irunes</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f3;padding:1.5rem}
.header{display:flex;align-items:center;justify-content:space-between;padding:1rem 0;border-bottom:0.5px solid #ddd;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.header h1{font-size:18px;font-weight:500}
.btn{border:0.5px solid #ccc;background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;color:#1a1a1a;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{background:#f0f0ee}
.btn-primary{background:#e6f1fb;border-color:#b5d4f4;color:#0c447c}
.btn-primary:hover{opacity:.85}
.btn-sm{padding:3px 8px;font-size:12px}
.btn-danger{border-color:#f7c1c1;color:#791f1f}
.btn-danger:hover{background:#fcebeb}

/* Alertas */
.alert-bar{border-radius:8px;padding:10px 14px;margin-bottom:1rem;font-size:13px;display:flex;align-items:flex-start;gap:8px}
.alert-warn{background:#faeeda;border:0.5px solid #fac775;color:#633806}
.alert-danger{background:#fcebeb;border:0.5px solid #f7c1c1;color:#791f1f}
.alert-info{background:#e6f1fb;border:0.5px solid #b5d4f4;color:#0c447c}

/* Cards grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;margin-top:1rem}
.card{background:#fff;border-radius:12px;border:0.5px solid #ddd;padding:1.2rem;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.card.alerta-danger{border-color:#f7c1c1;background:#fffafa}
.card.alerta-warn{border-color:#fac775;background:#fffdf5}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.card-id{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em}
.card-matricula{font-size:18px;font-weight:600;letter-spacing:.05em}
.card-modelo{font-size:12px;color:#666;margin-bottom:.8rem}
.card-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:0.5px solid #f0f0ee}
.card-row:last-child{border-bottom:none}
.card-label{color:#888}
.card-val{font-weight:500;text-align:right}
.badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:10px;display:inline-block}
.badge-ok{background:#9fe1cb;color:#085041}
.badge-warn{background:#faeeda;color:#633806}
.badge-danger{background:#fcebeb;color:#791f1f}
.badge-gray{background:#f0f0ee;color:#888}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;border:0.5px solid #ddd;padding:1.5rem;width:min(560px,95vw);max-height:90vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.modal-header h2{font-size:16px;font-weight:500}
.section-title{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.05em;margin:1rem 0 .5rem;padding-bottom:4px;border-bottom:0.5px solid #eee}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:12px;color:#888}
.form-group input,.form-group select,.form-group textarea{font-size:13px;border:0.5px solid #ddd;border-radius:8px;padding:7px 9px;background:#fff;color:#1a1a1a}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#378add}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:1.25rem;padding-top:1rem;border-top:0.5px solid #eee}

/* Toast */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#1a1a1a;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:200;display:none}
.toast.show{display:block}

/* Lock */
#lock-screen{display:flex;position:fixed;inset:0;background:#f5f5f3;z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:1rem}
</style>
</head>
<body>

<!-- Lock -->
<div id="lock-screen">
  <div style="font-size:15px;font-weight:500">Vehículos CC Irunes</div>
  <div style="font-size:13px;color:#888">Introduce el código de acceso</div>
  <input id="lock-input" type="password" inputmode="numeric" maxlength="5"
    style="font-size:20px;letter-spacing:.3em;text-align:center;border:0.5px solid #ddd;border-radius:8px;padding:10px 16px;width:160px;background:#fff;outline:none"
    placeholder="·····">
  <button onclick="checkCode()" class="btn btn-primary">Entrar</button>
  <div id="lock-error" style="color:#791f1f;font-size:12px;display:none">Código incorrecto</div>
</div>

<div id="app" style="display:none">

<div class="header">
  <h1><i class="ti ti-car" style="font-size:18px;vertical-align:-2px;margin-right:6px"></i>Vehículos CC Irunes</h1>
</div>

<div id="alertas"></div>

<!-- Aviso Itvelesa -->
<div class="alert-bar alert-info">
  <i class="ti ti-info-circle" style="flex-shrink:0;margin-top:1px"></i>
  <span>Los datos de ITV se pueden consultar en <a href="https://www.itevelesa.com/clientes/mis-vehiculos.php" target="_blank" style="color:#0c447c;font-weight:500">Itvelesa · Mis vehículos</a>. Actualiza las fechas aquí tras cada revisión.</span>
</div>

<div class="grid" id="grid">
  <div style="grid-column:1/-1;text-align:center;padding:2rem;color:#aaa">Cargando...</div>
</div>

</div>

<!-- Modal edición -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="m-title">Vehículo</h2>
      <button class="btn btn-sm" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>

    <div class="section-title">Identificación</div>
    <div class="form-grid">
      <div class="form-group"><label>Nº / ID</label><input id="m-id" disabled style="background:#fafafa;color:#888"></div>
      <div class="form-group"><label>Matrícula</label><input id="m-matricula"></div>
      <div class="form-group full"><label>Modelo</label><input id="m-modelo"></div>
      <div class="form-group full"><label>Nº Via-T</label><input id="m-viat" placeholder="6039 7607 6388 XXXX"></div>
      <div class="form-group full"><label>Asignado a</label><input id="m-asignado"></div>
    </div>

    <div class="section-title">ITV</div>
    <div class="form-grid">
      <div class="form-group full"><label>Vencimiento ITV</label><input type="date" id="m-itv"></div>
    </div>

    <div class="section-title">Seguro</div>
    <div class="form-grid">
      <div class="form-group"><label>Vencimiento seguro</label><input type="date" id="m-seguro"></div>
      <div class="form-group"><label>Compañía</label><input id="m-compania"></div>
      <div class="form-group"><label>Póliza nº</label><input id="m-poliza"></div>
      <div class="form-group"><label>Precio 2025 (€)</label><input type="number" step="0.01" id="m-precio25"></div>
      <div class="form-group"><label>Precio 2026 (€)</label><input type="number" step="0.01" id="m-precio26"></div>
    </div>

    <div class="section-title">Notas</div>
    <div class="form-grid">
      <div class="form-group full"><textarea id="m-notas" rows="2" placeholder="Observaciones..."></textarea></div>
    </div>

    <div class="form-actions">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="m-guardar" onclick="guardar()"><i class="ti ti-check"></i>Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://dbydtwkzknbpifneznsu.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRieWR0d2t6a25icGlmbmV6bnN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMjMwODIsImV4cCI6MjA5MDc5OTA4Mn0.HcTWBEaI-2EH66mAUAaEM2ppzDG3eCd1ANjopNZdt1g';
const HEADERS={'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY};

let data=[], editId=null;

// ─── SESIÓN COMPARTIDA *.ccirunes.com ───────────────────────
const GRUPO='club';
const CC_HORAS=12;
const ccSesionActiva=g=>document.cookie.split('; ').some(c=>c==='cc_'+g+'=ok');
const ccAbrirSesion =g=>document.cookie=`cc_${g}=ok; domain=.ccirunes.com; path=/; max-age=${CC_HORAS*3600}; SameSite=Lax; Secure`;
const ccCerrarSesion=g=>document.cookie=`cc_${g}=; domain=.ccirunes.com; path=/; max-age=0; SameSite=Lax; Secure`;
// ────────────────────────────────────────────────────────────

function entrarApp(){
  document.getElementById('lock-screen').style.display='none';
  document.getElementById('app').style.display='block';
  loadData();
}

function checkCode(){
  if(document.getElementById('lock-input').value==='2121'){
    ccAbrirSesion(GRUPO);
    entrarApp();
  } else {
    document.getElementById('lock-error').style.display='block';
    document.getElementById('lock-input').value='';
  }
}
document.getElementById('lock-input').addEventListener('keydown',e=>{if(e.key==='Enter')checkCode();});

function toast(msg,err){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=err?'#791f1f':'#1a1a1a';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}

async function api(method,path,body){
  const opts={method,headers:{...HEADERS,'Prefer':method==='POST'?'return=representation':'return=representation'}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,opts);
  if(!r.ok){const e=await r.text();throw new Error(e);}
  if(r.status===204)return null;
  return r.json();
}

async function loadData(){
  try{
    data=await api('GET','vehiculos?select=*&order=id.asc');
    render();
  }catch(e){
    document.getElementById('grid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:2rem;color:#aaa">Error cargando datos</div>';
    toast('Error al cargar',true);
  }
}

function diasPara(dateStr){
  if(!dateStr) return null;
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const d=new Date(dateStr);
  return Math.round((d-hoy)/864e5);
}

function badgeVencimiento(dias){
  if(dias===null) return '<span class="badge badge-gray">Sin fecha</span>';
  if(dias<0) return '<span class="badge badge-danger">Vencida hace '+Math.abs(dias)+'d</span>';
  if(dias<=30) return '<span class="badge badge-warn">Vence en '+dias+'d</span>';
  return '<span class="badge badge-ok">'+new Date(Date.now()+dias*864e5).toLocaleDateString('es-ES')+'</span>';
}

function alertaClass(v){
  const itvD=diasPara(v.vencimiento_itv);
  const segD=diasPara(v.vencimiento_seguro);
  const danger=(itvD!==null&&itvD<0)||(segD!==null&&segD<0);
  const warn=(itvD!==null&&itvD>=0&&itvD<=30)||(segD!==null&&segD>=0&&segD<=30);
  if(danger) return 'alerta-danger';
  if(warn) return 'alerta-warn';
  return '';
}

function render(){
  // Alertas globales
  const msgs30=[], msgsVenc=[];
  data.forEach(v=>{
    const itvD=diasPara(v.vencimiento_itv);
    const segD=diasPara(v.vencimiento_seguro);
    if(itvD!==null&&itvD<0) msgsVenc.push('<b>'+v.matricula+'</b>: ITV vencida hace '+Math.abs(itvD)+' días');
    else if(itvD!==null&&itvD<=30) msgs30.push('<b>'+v.matricula+'</b>: ITV vence en '+itvD+' días');
    if(segD!==null&&segD<0) msgsVenc.push('<b>'+v.matricula+'</b>: Seguro vencido hace '+Math.abs(segD)+' días');
    else if(segD!==null&&segD<=30) msgs30.push('<b>'+v.matricula+'</b>: Seguro vence en '+segD+' días');
  });
  let alertasHtml='';
  if(msgsVenc.length) alertasHtml+='<div class="alert-bar alert-danger"><i class="ti ti-alert-triangle" style="flex-shrink:0;margin-top:1px"></i><span>'+msgsVenc.join('<br>')+'</span></div>';
  if(msgs30.length) alertasHtml+='<div class="alert-bar alert-warn"><i class="ti ti-bell" style="flex-shrink:0;margin-top:1px"></i><span>'+msgs30.join('<br>')+'</span></div>';
  document.getElementById('alertas').innerHTML=alertasHtml;

  // Cards
  document.getElementById('grid').innerHTML=data.map(v=>{
    const itvD=diasPara(v.vencimiento_itv);
    const segD=diasPara(v.vencimiento_seguro);
    return `<div class="card ${alertaClass(v)}" onclick="openModal('${v.id}')">
      <div class="card-top">
        <span class="card-id">${v.id}</span>
        <span class="badge badge-gray">${v.asignado_a||'—'}</span>
      </div>
      <div class="card-matricula">${v.matricula}</div>
      <div class="card-modelo">${v.modelo||'—'}</div>
      <div class="card-row"><span class="card-label">ITV</span><span class="card-val">${badgeVencimiento(itvD)}</span></div>
      <div class="card-row"><span class="card-label">Seguro</span><span class="card-val">${badgeVencimiento(segD)}</span></div>
      <div class="card-row"><span class="card-label">Compañía</span><span class="card-val">${v.compania_seguro||'—'}</span></div>
      <div class="card-row"><span class="card-label">Via-T</span><span class="card-val">${v.via_t||'—'}</span></div>
    </div>`;
  }).join('');
}

function openModal(id){
  editId=id;
  const v=data.find(x=>x.id===id);
  document.getElementById('m-title').textContent=v.matricula+' — '+v.modelo;
  document.getElementById('m-id').value=v.id;
  document.getElementById('m-matricula').value=v.matricula||'';
  document.getElementById('m-modelo').value=v.modelo||'';
  document.getElementById('m-viat').value=v.via_t||'';
  document.getElementById('m-asignado').value=v.asignado_a||'';
  document.getElementById('m-itv').value=v.vencimiento_itv||'';
  document.getElementById('m-seguro').value=v.vencimiento_seguro||'';
  document.getElementById('m-compania').value=v.compania_seguro||'';
  document.getElementById('m-poliza').value=v.poliza||'';
  document.getElementById('m-precio25').value=v.precio_seguro_2025||'';
  document.getElementById('m-precio26').value=v.precio_seguro_2026||'';
  document.getElementById('m-notas').value=v.notas||'';
  document.getElementById('modal').classList.add('open');
}

function closeModal(){document.getElementById('modal').classList.remove('open');}

async function guardar(){
  const btn=document.getElementById('m-guardar');
  btn.disabled=true;btn.innerHTML='<i class="ti ti-loader"></i>Guardando...';
  const body={
    matricula:document.getElementById('m-matricula').value.trim(),
    modelo:document.getElementById('m-modelo').value.trim()||null,
    via_t:document.getElementById('m-viat').value.trim()||null,
    asignado_a:document.getElementById('m-asignado').value.trim()||null,
    vencimiento_itv:document.getElementById('m-itv').value||null,
    vencimiento_seguro:document.getElementById('m-seguro').value||null,
    compania_seguro:document.getElementById('m-compania').value.trim()||null,
    poliza:document.getElementById('m-poliza').value.trim()||null,
    precio_seguro_2025:parseFloat(document.getElementById('m-precio25').value)||null,
    precio_seguro_2026:parseFloat(document.getElementById('m-precio26').value)||null,
    notas:document.getElementById('m-notas').value.trim()||null,
  };
  try{
    const rows=await api('PATCH','vehiculos?id=eq.'+encodeURIComponent(editId),body);
    const idx=data.findIndex(x=>x.id===editId);
    if(Array.isArray(rows)&&rows.length) data[idx]=rows[0];
    else data[idx]={...data[idx],...body};
    toast('Guardado correctamente');
    closeModal();render();
  }catch(e){
    toast('Error al guardar: '+e.message,true);
  }finally{
    btn.disabled=false;btn.innerHTML='<i class="ti ti-check"></i>Guardar';
  }
}

// Si ya hay sesión abierta en otra app del grupo, entrar directo
if (ccSesionActiva(GRUPO)) entrarApp();
</script>
</body>
</html>
